<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="ui-sans-serif,system-ui,Helvetica,Arial" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#f8fafc"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Send Check — architecture</text>
  <text x="440" y="54" text-anchor="middle" fill="#475569">score before you send · pluggable backends · owner approves everything</text>

  <!-- Surfaces -->
  <g>
    <rect x="40" y="90" width="190" height="64" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="135" y="116" text-anchor="middle" font-weight="600" fill="#0f172a">/send-check skill</text>
    <text x="135" y="136" text-anchor="middle" fill="#475569" font-size="12">inside Claude (plugin style)</text>

    <rect x="40" y="170" width="190" height="64" rx="10" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="135" y="196" text-anchor="middle" font-weight="600" fill="#0f172a">Web paste-box</text>
    <text x="135" y="216" text-anchor="middle" fill="#475569" font-size="12">web/ · FastAPI</text>
  </g>

  <!-- Gateway -->
  <rect x="300" y="122" width="180" height="80" rx="10" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="390" y="150" text-anchor="middle" font-weight="600" fill="#0f172a">Gateway</text>
  <text x="390" y="170" text-anchor="middle" fill="#475569" font-size="12">draft + recipient context</text>
  <text x="390" y="187" text-anchor="middle" fill="#475569" font-size="12">(URL fetch → Recipient)</text>

  <!-- Contract -->
  <rect x="300" y="250" width="180" height="56" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="390" y="274" text-anchor="middle" font-weight="600" fill="#0f172a">scorers/base.py</text>
  <text x="390" y="292" text-anchor="middle" fill="#92400e" font-size="12">ScoringBackend · FROZEN H1</text>

  <!-- Backends -->
  <rect x="560" y="96" width="280" height="150" rx="10" fill="#dcfce7" stroke="#4ade80"/>
  <text x="700" y="120" text-anchor="middle" font-weight="600" fill="#0f172a">naive (default · MIT · no deps)</text>
  <text x="700" y="144" text-anchor="middle" fill="#166534" font-size="12">mechanical checks · you/I ratio · length</text>
  <text x="700" y="162" text-anchor="middle" fill="#166534" font-size="12">slop: generic-phrase n-gram match</text>
  <text x="700" y="180" text-anchor="middle" fill="#166534" font-size="12">Claude-as-judge · structured rubric</text>
  <text x="700" y="204" text-anchor="middle" fill="#166534" font-size="12" font-style="italic">answers: “is this good outreach?”</text>

  <rect x="560" y="268" width="280" height="110" rx="10" fill="#f3e8ff" stroke="#c084fc"/>
  <text x="700" y="292" text-anchor="middle" font-weight="600" fill="#0f172a">semalytics (adapter · env key)</text>
  <text x="700" y="314" text-anchor="middle" fill="#6b21a8" font-size="12">audience-fit measured against</text>
  <text x="700" y="331" text-anchor="middle" fill="#6b21a8" font-size="12">peer-reviewed personality research</text>
  <text x="700" y="354" text-anchor="middle" fill="#6b21a8" font-size="12" font-style="italic">answers: “does it fit this person?”</text>

  <!-- Scorecard -->
  <rect x="300" y="380" width="180" height="120" rx="10" fill="#fee2e2" stroke="#f87171"/>
  <text x="390" y="406" text-anchor="middle" font-weight="600" fill="#0f172a">Scorecard</text>
  <text x="390" y="428" text-anchor="middle" fill="#7f1d1d" font-size="12">verdict: send / fix / scrap</text>
  <text x="390" y="446" text-anchor="middle" fill="#7f1d1d" font-size="12">dimensions + evidence</text>
  <text x="390" y="464" text-anchor="middle" fill="#7f1d1d" font-size="12">suggested fix (shown, not applied)</text>
  <text x="390" y="482" text-anchor="middle" fill="#7f1d1d" font-size="12">score log → reply analysis (roadmap)</text>

  <!-- Owner -->
  <rect x="60" y="402" width="150" height="76" rx="38" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="135" y="434" text-anchor="middle" font-weight="600" fill="#0f172a">Owner</text>
  <text x="135" y="454" text-anchor="middle" fill="#475569" font-size="12">approves · sends</text>

  <!-- Arrows -->
  <path d="M230 122 L300 146" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M230 202 L300 178" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M390 202 L390 250" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M480 262 L560 180" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M480 290 L560 310" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M390 306 L390 380" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M300 440 L210 440" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="430" y="348" fill="#64748b" font-size="12">one contract, any backend</text>
  <text x="222" y="430" fill="#64748b" font-size="12" text-anchor="middle"></text>
</svg>
