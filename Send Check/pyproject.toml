[project]
name = "sendcheck"
version = "0.1.0"
description = "Quality gate for AI-drafted outreach: score before you send"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.8",
    "openpyxl>=3.1.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = ["pytest>=8"]
