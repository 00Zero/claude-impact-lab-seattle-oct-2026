# Runs the competitor monitor against Supabase on GitHub's servers.
#
# GitHub only runs scheduled workflows from the default branch (main), so this
# file has to be on main to fire. It checks out the Python pipeline from the
# `app` branch, so main doesn't need the rest of the Python code.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   required: ANTHROPIC_API_KEY, TAVILY_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
#   optional: GOOGLE_PLACES_API_KEY, RESEND_API_KEY, RESEND_FROM,
#             TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_FROM

name: Competitor monitor

on:
  schedule:
    - cron: "0 15 * * 1,3,5"  # Mon/Wed/Fri 15:00 UTC = 8am Seattle in summer, 7am in winter
    - cron: "10 * * * *"      # hourly: send texts/emails that are due
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [check-all, deliver]
        default: check-all

concurrency:
  group: competitor-monitor-${{ github.event.schedule || inputs.task }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: app

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check every monitored business
        if: github.event.schedule == '0 15 * * 1,3,5' || inputs.task == 'check-all'
        run: python agent/monitor.py --all

      - name: Send due texts and emails
        if: github.event.schedule == '10 * * * *' || inputs.task == 'deliver'
        run: python agent/monitor.py --deliver
