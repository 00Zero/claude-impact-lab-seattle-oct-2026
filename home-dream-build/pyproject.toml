[project]
name = "homedreambuild-agent"
version = "0.1.0"
description = "Dream Home Build: Instagram reels auto-posting agent + Instagram CRM agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pillow>=10.4",
    "apscheduler>=3.10,<4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "twilio>=9.2",
    "google-auth-oauthlib>=1.5.0",
    "pillow-heif>=1.8.1",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
