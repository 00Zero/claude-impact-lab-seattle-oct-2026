[project]
name = "datamap-for-small-business"
version = "0.1.0"
description = "Turn a pile of customer feedback into an interactive datamap and an insights report, locally."
readme = "README.md"
license = "Apache-2.0"
# 3.12: supported by every pipeline library (numba, torch, umap, ...).
requires-python = "==3.12.*"
# Same pins as the Seshette environment in the King Tutte Datamap Scrolls.
dependencies = [
    "datamapplot==0.7.3",
    "fast-hdbscan==0.3.2",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyarrow==26.0.0",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "sentence-transformers==5.7.0",
    "umap-learn==0.5.12",
]

[project.scripts]
datamap = "datamap.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datamap"]
