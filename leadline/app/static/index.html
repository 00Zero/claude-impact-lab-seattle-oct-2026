<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leadline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --side:#1B1616; --side-ink:#F3EFEF; --side-muted:#8E8585; --side-chip:#3A3333;
  --canvas:#EFEFF1; --card:#FFFFFF; --ink:#141414; --muted:#6E6E73; --line:#E3E3E7; --track:#EDEDF0;
  --blue:#4A86E8; --b1:#CFE3F8; --b2:#9CC3F1; --b3:#4A86E8;
  --dark-card:#1B1616; --dark-ink:#F5F2F2; --dark-muted:#A79E9E;
  --av-ink:#1E4E9A; --good:#1F8A5B; --warn:#B8650C; --btn:#141414; --btn-ink:#FFFFFF; --pill:#FFFFFF;
  --scrim:rgba(20,16,16,.45);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --side:#0B0A0A; --side-ink:#F3EFEF; --side-muted:#8A8282; --side-chip:#2A2525;
    --canvas:#161618; --card:#202024; --ink:#F2F2F4; --muted:#A1A1A8; --line:#2E2E34; --track:#33333A;
    --blue:#6FA2F0; --b1:#1F3350; --b2:#2D5288; --b3:#5B93EC;
    --dark-card:#F2EFEF; --dark-ink:#141414; --dark-muted:#5E5757;
    --av-ink:#CFE3F8; --good:#55CC94; --warn:#F0A75A; --btn:#F2F2F4; --btn-ink:#141414; --pill:#2A2A30;
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --side:#0B0A0A; --side-ink:#F3EFEF; --side-muted:#8A8282; --side-chip:#2A2525;
  --canvas:#161618; --card:#202024; --ink:#F2F2F4; --muted:#A1A1A8; --line:#2E2E34; --track:#33333A;
  --blue:#6FA2F0; --b1:#1F3350; --b2:#2D5288; --b3:#5B93EC;
  --dark-card:#F2EFEF; --dark-ink:#141414; --dark-muted:#5E5757;
  --av-ink:#CFE3F8; --good:#55CC94; --warn:#F0A75A; --btn:#F2F2F4; --btn-ink:#141414; --pill:#2A2A30;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;background:var(--side);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--side);color:var(--ink);font-family:Onest,"Helvetica Neue",Arial,system-ui,sans-serif;font-size:15px;line-height:1.45;font-weight:400;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}

/* sidebar */
.side{background:var(--side);color:var(--side-ink);padding:34px 26px 24px;display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:0 0 40px}
.nav{display:flex;align-items:center;gap:14px;padding:10px 0;background:none;border:0;cursor:pointer;width:100%;text-align:left;font-size:16px;color:var(--side-ink);opacity:.82}
.nav:hover,.nav[aria-current="page"]{opacity:1}
.nav[aria-current="page"] span{border-bottom:1px solid currentColor}
.sec{display:flex;justify-content:space-between;align-items:center;color:var(--side-muted);font-size:14px;margin:34px 0 10px}
.view{display:flex;align-items:center;gap:14px;padding:8px 0;background:none;border:0;cursor:pointer;width:100%;text-align:left;color:var(--side-ink);font-size:16px}
.view .ic{width:44px;height:44px;border-radius:50%;background:var(--side-chip);display:grid;place-items:center;flex:none}
.view .ic svg{width:20px;height:20px}
.view small{display:block;color:var(--side-muted);font-size:13px}
.view[aria-pressed="true"] .ic{background:var(--side-ink);color:var(--side)}
.me{margin-top:auto;padding-top:24px;display:flex;align-items:center;gap:12px}
.me .av{background:var(--side-chip);color:var(--side-ink)}
.me div{flex:1;min-width:0}
.me small{display:block;color:var(--side-muted);font-size:13px}

.seller{background:var(--side-chip);border-radius:22px;padding:16px 16px 14px;margin:-14px 0 22px}
.seller small{display:block;color:var(--side-muted);font-size:12.5px}
.seller b{display:block;font-weight:500;font-size:16px;margin:2px 0 4px}
.seller p{margin:0;font-size:13px;color:var(--side-muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mailline{display:flex;align-items:center;gap:8px;background:var(--canvas);border-radius:14px;padding:9px 12px;margin:0 0 14px;font-size:13.5px;min-width:0}
.mailline svg{width:17px;height:17px;flex:none;color:var(--blue)}
.mailline span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead.pick .mailline{background:rgba(127,127,127,.18)}
.mail{background:var(--card);border-radius:28px;overflow:hidden;align-self:start}
.mail-tools{display:flex;gap:10px;align-items:center;padding:16px 18px 0;flex-wrap:wrap}
.mail-tools .seg{flex:1;min-width:240px}
.mail-head{display:grid;grid-template-columns:72px 1fr;gap:8px 12px;padding:18px 26px 16px;border-bottom:1px solid var(--line);font-size:15px;margin:0}
.mail-head dt{color:var(--muted)}
.mail-head dd{margin:0;overflow-wrap:anywhere}
.mail-head .subj{font-size:20px;font-weight:500;grid-column:1/-1;margin-top:6px;letter-spacing:-.01em}
.mail-body{padding:22px 26px 22px;font-size:16.5px;line-height:1.7;white-space:pre-wrap;max-width:68ch}
mark{color:inherit;padding:1px 2px;border-radius:4px}
mark.ml{background:rgba(74,134,232,.14);box-shadow:inset 0 -2px 0 var(--blue)}
mark.my{background:rgba(229,150,40,.16);box-shadow:inset 0 -2px 0 #E0962A}
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;padding:0 26px 22px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block;flex:none}
.mail-edit{padding:4px 26px 24px}
/* canvas */
.canvas{background:var(--canvas);margin:16px 16px 16px 0;border-radius:40px;padding:26px 28px 40px;min-width:0}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.ask{flex:1;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:999px;padding:6px 6px 6px 20px;min-height:58px;border:1px solid transparent}
.ask:focus-within{border-color:var(--blue)}
.ask input{flex:1;border:0;background:transparent;font-size:16px;outline:none;min-width:0;padding:10px 0}
.ask .spark{color:var(--blue)}
.circle{width:58px;height:58px;border-radius:50%;background:var(--card);border:0;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.circle:hover{background:var(--pill)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:12px 20px;min-height:46px;cursor:pointer;font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn.dark{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.dark:hover{filter:brightness(1.15)}
.btn.big{min-height:58px;padding:0 26px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border-color:transparent}
.menu{display:none}

/* agent panel */
.agent{background:var(--card);border-radius:28px;padding:20px 24px;margin-bottom:18px}
.agent-head{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.agent-head .grow{flex:1}
.turn{margin-top:14px}
.turn .you{font-size:14px;color:var(--muted)}
.turn .say{font-size:18px;font-weight:300;margin-top:4px;white-space:pre-wrap}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.step{font-size:13px;background:var(--canvas);border-radius:999px;padding:5px 12px;color:var(--ink)}
.suggest{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 18px}
.sg{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--ink)}
.sg:hover{background:var(--card)}
.filterchip{display:inline-flex;align-items:center;gap:8px;background:var(--btn);color:var(--btn-ink);border-radius:999px;padding:8px 8px 8px 16px;font-size:14px;margin:0 0 14px}
.filterchip button{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:50%;width:26px;height:26px;cursor:pointer}

/* top row */
.row{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;margin-bottom:34px}
.panel{background:var(--card);border-radius:32px;padding:26px 28px}
.p-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.p-title h2{font-size:20px;font-weight:400;margin:0;flex:1}
.big{font-size:40px;font-weight:300;letter-spacing:-.02em;line-height:1}
.delta{font-size:14px;color:var(--muted)}
.funnel{position:relative;margin-top:18px}
.funnel svg{display:block;width:100%;height:230px}
.flabels{position:absolute;inset:0;pointer-events:none}
.flabels .lb{position:absolute;top:0;transform:translateX(-50%);font-size:14px;color:var(--ink);white-space:nowrap}
.flabels .ln{position:absolute;top:24px;bottom:0;width:1px;background:var(--card);opacity:.7}
.flabels .pc{position:absolute;top:50%;transform:translate(-50%,-50%);background:#fff;color:#141414;border-radius:999px;padding:4px 12px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.task{margin-top:20px;cursor:pointer;border:0;background:none;width:100%;text-align:left;padding:0}
.task .t{display:flex;justify-content:space-between;gap:10px;font-size:16px}
.task .t small{font-size:14px;color:var(--muted);white-space:nowrap}
.bar{height:8px;background:var(--track);border-radius:999px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:999px}
.arrow{width:54px;height:54px;border-radius:50%;background:var(--btn);color:var(--btn-ink);border:0;display:grid;place-items:center;cursor:pointer}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(300px,1fr);gap:22px;overflow-x:auto;padding:4px 4px 12px;margin:0 -4px;scroll-snap-type:x proximity}
.col{min-width:0;scroll-snap-align:start}
.col h2{font-size:34px;font-weight:300;letter-spacing:-.02em;margin:0 0 18px;white-space:nowrap}
.lead{background:var(--card);border-radius:28px;padding:22px 24px;margin-bottom:18px;cursor:pointer;border:1px solid transparent;transition:transform .15s}
.lead:hover{border-color:var(--line)}
.lead h3{font-size:20px;font-weight:400;margin:0 0 10px;letter-spacing:-.01em}
.lead p{margin:0 0 14px;font-size:15.5px;line-height:1.5}
.lead .why{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.lead .why li{display:flex;gap:8px}
.lead .why li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good);margin-top:7px;flex:none}
.lead .why li.w::before{background:var(--warn)}
.prog{display:flex;justify-content:space-between;font-size:14px}
.lead-foot{display:flex;align-items:center;gap:10px;margin-top:16px}
.lead-foot .who{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:14px;font-size:14px;align-items:center}
.meta span{display:inline-flex;gap:5px;align-items:center}
.meta svg{width:18px;height:18px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:500;flex:none;background:var(--b1);color:var(--av-ink)}
.lead.pick{background:var(--dark-card);color:var(--dark-ink);transform:rotate(-2.2deg);margin:6px 4px 26px}
.lead.pick:hover{transform:rotate(-1deg)}
.lead.pick .why{color:var(--dark-muted)}
.lead.pick .bar{background:rgba(255,255,255,.85)}
.lead.pick .tag{display:inline-block;font-size:12px;border:1px solid currentColor;border-radius:999px;padding:2px 10px;margin-bottom:12px;opacity:.8}
.colempty{border:1px dashed var(--line);border-radius:28px;padding:24px;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){.lead,.lead.pick{transition:none}}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--canvas);z-index:41;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .26s ease;border-radius:36px 0 0 36px;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
@media (prefers-reduced-motion: reduce){.drawer,.scrim{transition:none}}
.d-head{display:flex;align-items:center;gap:14px;padding:22px 26px 10px}
.d-head h2{margin:0;font-size:30px;font-weight:300;letter-spacing:-.02em;flex:1;min-width:0}
.d-head .sub{font-size:14px;color:var(--muted);font-weight:400;letter-spacing:0}
.d-body{flex:1;overflow-y:auto;display:grid;grid-auto-rows:max-content;grid-template-columns:minmax(0,1fr) 320px;gap:18px;padding:10px 26px 26px;align-content:start}
.facts{display:grid;gap:12px;margin:16px 0 0;font-size:14.5px}
.facts dt{font-size:12.5px;color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.facts a{color:var(--blue)}
.panel h3{font-size:16px;font-weight:500;margin:0 0 10px}
.d-body .panel + .panel{margin-top:18px}
.why2{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14.5px}
.why2 li{display:flex;gap:8px}
.why2 li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);margin-top:7px;flex:none}
.why2.w li::before{background:var(--warn)}
.seg{display:flex;gap:4px;background:var(--canvas);border-radius:999px;padding:4px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 14px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:40px}
.seg button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.field{display:block;margin-top:14px}
.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--canvas);border-radius:18px;padding:12px 16px;font-size:16px}
.field textarea{resize:vertical;line-height:1.55;min-height:260px}
.edited{font-size:11px;color:var(--warn);margin-left:6px}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.d-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 26px calc(14px + env(safe-area-inset-bottom,0px));background:var(--card)}
.d-actions .grow{flex:1}
.stsel{border:1px solid var(--line);background:var(--canvas);border-radius:999px;padding:10px 14px;min-height:46px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:12px 20px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

@media (max-width:1180px){ .row{grid-template-columns:minmax(0,1fr)} }
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;z-index:45;transform:translateX(-100%);transition:transform .25s ease;padding-top:calc(30px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .side.open{transform:none}
  .menu{display:grid}
  .canvas{margin:8px;border-radius:28px;padding:14px 12px 28px}
  .topbar{flex-wrap:wrap}
  .ask{order:3;flex:1 1 100%;min-height:52px}
  .topbar .mhead{flex:1;font-size:22px;font-weight:600;color:var(--ink)}
  .circle{width:48px;height:48px}
  .btn.big{min-height:48px;padding:0 18px}
  .panel{border-radius:26px;padding:20px}
  .big{font-size:32px}
  .funnel svg{height:170px}
  .flabels .lb{font-size:12px}
  .flabels .pc{font-size:12px;padding:3px 8px}
  .board{grid-auto-columns:86%}
  .suggest{flex-wrap:nowrap;overflow-x:auto;margin:-4px -12px 14px;padding:0 12px;scrollbar-width:none}
  .sg{flex:none;white-space:nowrap}
  .col h2{font-size:28px}
  .drawer{border-radius:0}
  .d-body{grid-template-columns:minmax(0,1fr);padding:8px 14px 20px}
  .mail-head{padding:16px 18px 14px;grid-template-columns:52px 1fr}
  .mail-body{padding:18px;font-size:16px}
  .legend{padding:0 18px 18px}
  .mail-edit{padding:4px 18px 20px}
  .mail-tools{padding:14px 14px 0}
  .mail-tools .seg{min-width:0;flex:1 1 100%}
  .d-head{padding:16px 14px 8px}
  .d-head h2{font-size:24px}
  .d-actions{padding-left:14px;padding-right:14px}
  .d-actions .btn{flex:1}
  .d-actions .grow{display:none}
  .two{grid-template-columns:1fr}
}
@media (min-width:901px){ .mhead{display:none} }

/* find leads */
.find{max-width:860px}
.find .panel + .panel{margin-top:18px}
.find h2{font-size:30px;font-weight:300;letter-spacing:-.02em;margin:0 0 6px}
.find .lede{color:var(--muted);margin:0 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--canvas);border-radius:999px;padding:9px 14px;font-size:14.5px;cursor:pointer;min-height:42px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.qlabel{display:block;font-size:13px;color:var(--muted);margin:16px 0 8px}
.find details{margin-top:16px}
.find summary{cursor:pointer;color:var(--muted);font-size:14px}
.find .go{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.err{background:rgba(184,101,12,.12);color:var(--ink);border-radius:14px;padding:10px 14px;margin-top:14px;font-size:14.5px}
.modeline{font-size:13px;color:var(--muted);margin-top:12px}
.plog{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px;font-size:14.5px}
.plog li::before{content:"✓ ";color:var(--good)}
.tier{display:inline-block;font-size:12px;font-weight:500;border-radius:999px;padding:2px 10px;margin-bottom:10px}
.tier.now{background:rgba(31,138,91,.14);color:var(--good)}
.tier.try{background:rgba(184,101,12,.14);color:var(--warn)}
.tier.later,.tier.skip{background:var(--track);color:var(--muted)}
.tier.need_email{background:rgba(74,134,232,.14);color:var(--blue)}
.lead.pick .tier{background:rgba(255,255,255,.18);color:inherit}
.ver{font-size:12px;color:var(--muted);margin-left:6px}
.stars{color:#E0962A;font-size:14px;letter-spacing:1px;margin-left:4px}
.stars span{color:var(--track)}
.lead.pick .stars span{color:rgba(255,255,255,.25)}
.alist{margin-top:30px}
.alist h2{font-size:28px;font-weight:300;letter-spacing:-.02em;margin:0 0 6px}
.arow{background:var(--card);border-radius:22px;padding:16px 20px;margin-top:12px;display:grid;gap:8px}
.arow b{font-weight:500;font-size:16px}
.arow span{color:var(--muted);font-size:14px}
.arow form{display:flex;gap:8px;flex-wrap:wrap}
.arow input{flex:1 1 220px;border:1px solid var(--line);background:var(--canvas);border-radius:999px;padding:10px 16px;min-height:44px;font-size:15px}

function renderFunnel(){
  const LEADS = BOARD();
  const n = LEADS.length || 1;
  const reached = s => LEADS.filter(l => STAGES.findIndex(x => x[0] === stageOf(l.lead_id)) >= s).length;
  const vals = [1, reached(1)/n, reached(2)/n, reached(3)/n];
  $("fBig").textContent = LEADS.length;
  $("fDelta").textContent = imported ? `leads from ${imported.name}` : search ? `leads with an email, from ${search.source}` : "potential customers";
  const W = 1000, H = 230, cy = H/2, xs = [0, 200, 420, 640, 860, 1000];
  const hs = [1, ...vals, Math.max(vals[3]*.7, .04)].map(v => Math.max(v, .04));
  const band = f => {
    const top = xs.map((x,i) => [x, cy - hs[i]*f*(H/2 - 4)]), bot = xs.map((x,i) => [x, cy + hs[i]*f*(H/2 - 4)]);
    const curve = pts => pts.slice(1).map((p,i) => { const a = pts[i], mx = (a[0]+p[0])/2; return `C${mx},${a[1]} ${mx},${p[1]} ${p[0]},${p[1]}`; }).join(" ");
    const rb = bot.slice().reverse();
    return `M${top[0][0]},${top[0][1]} ${curve(top)} L${rb[0][0]},${rb[0][1]} ${curve(rb)} Z`;
  };
  const labels = ["Found","Drafted","Emailed","Replied"];
  $("funnel").innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${band(1)}" fill="var(--b1)"/><path d="${band(.8)}" fill="var(--b2)"/><path d="${band(.55)}" fill="var(--b3)"/></svg>
    <div class="flabels">${xs.slice(1,5).map((x,i) => `<span class="ln" style="left:${x/10}%"></span><span class="lb" style="left:${x/10}%">${labels[i]}</span><span class="pc" style="left:${x/10}%">${Math.round(vals[i]*100)}%</span>`).join("")}</div>
    <p class="sr">${labels.map((l,i) => `${l}: ${Math.round(vals[i]*100)}%`).join(", ")}</p>`;
}

function agentInstructions(){
  return `You are Leadline, a CRM that one business runs entirely by talking to you. You help this business win customers from its own list of leads.
THE BUSINESS YOU WORK FOR: ${profile.company}. We ${profile.pitch}. Proof: ${profile.proof} First step we offer: ${profile.cta}. Emails are signed ${profile.senderName}, ${profile.senderTitle}.

- To write emails: call get_lead, then draft_email. Each email is under 120 words, greets the contact by first name if known, mentions one specific detail from the lead's website text or hook, connects it to what ${profile.company} does, offers ${profile.cta}, and signs off with the sender's name, title and company. Plain text.
- You cannot send email. The user sends drafts from the lead page. Say so if asked to send.
- To show a lead to the user, call open_lead.
- Follow-ups: leads in stage "emailed" for 3 or more days are ready for a nudge.

}

const TOOLS = [

   execute(i){
     let r = LEADS;

     if (i.stage) r = r.filter(l => stageOf(l.lead_id) === i.stage);
     if (i.has_contact_name === true) r = r.filter(l => l.contact_name);
     if (i.text) { const t = String(i.text).toLowerCase(); r = r.filter(l => [l.business_name, l.summary, l.address, l.website_text].join(" ").toLowerCase().includes(t)); }
     step(`Looked through ${r.length} leads`);
     return r.map(l => ({...compact(l), days_in_stage: stages[l.lead_id] ? Math.floor((Date.now() - stages[l.lead_id].at)/DAY) : null}));
   }},
  {name:"show_leads", description:"Filters the pipeline board to exactly these lead ids, with a short label. Returns how many are shown.",

   execute(i){ const ids = new Set((i.ids || []).map(String).filter(id => byId(id))); viewFilter = {ids, label:String(i.label || "Leadline’s results"), key:null}; renderAll(); step(`Showing ${ids.size} leads`); return {shown:ids.size}; }},
  {name:"get_lead", description:"Returns full details for one lead, including what its website says and a hook that connects it to this business.",

function basicSearch(q){
  const t = q.toLowerCase(); let r = LEADS;
  // Without Claude, requests to write or explain can't be done; filtering on their words would mislead.
  if (/\b(follow.?up|nudge)/.test(t)) {
    r = LEADS.filter(l => stageOf(l.lead_id) === "emailed");
    viewFilter = {ids:new Set(r.map(l => String(l.lead_id))), label:"Emailed, waiting on a reply", key:null}; renderAll();
    return r.length ? `Showing ${r.length} emailed lead${r.length === 1 ? "" : "s"} you could follow up with. Claude isn’t connected on this page, so I can only filter right now.` : "No emailed leads to follow up with yet.";
  }
  if (/^(please\s+)?(draft|write|rewrite|send|email|why|how|explain|tell)\b/.test(t))
    return "Claude isn’t connected on this page, so I can’t write or explain here. Open any lead to see its ready-made email, or search by business name, type or stage.";
  const v = views().find(x => t.includes(x.key.toLowerCase().slice(0,5)) || t.includes(x.label.toLowerCase().slice(0,5)));
  if (v) r = r.filter(l => l.category === v.key);
  if (/named|contact|person/.test(t)) r = r.filter(l => l.contact_name);
  const st = STAGES.find(([k]) => new RegExp(`\\b${k}\\b`).test(t)); if (st) r = r.filter(l => stageOf(l.lead_id) === st[0]);
  if (r === LEADS) r = LEADS.filter(l => [l.business_name, l.contact_name, l.summary, l.address].join(" ").toLowerCase().includes(t));
  viewFilter = {ids:new Set(r.map(l => String(l.lead_id))), label:q, key:null}; renderAll();
  return r.length ? `Showing ${r.length} matching lead${r.length === 1 ? "" : "s"}. Claude isn’t connected on this page, so I can only filter by keywords right now.` : "No leads matched those words. Claude isn’t connected on this page, so try a business name, type or stage.";
}
async function ask(q){
  q = q.trim(); if (!q) return;
  $("askInput").value = ""; agentCtl?.abort();
  if (!sampleFn || !toolsOK){ lastExchange = {you:q, say:basicSearch(q), steps:[], busy:false, mode:"basic"}; renderAgent(); return; }
  // A newer ask() replaces lastExchange and agentCtl; this run only touches its own copies.
  const ctl = agentCtl = new AbortController(), mine = {role:"user", content:q};
  const ex = lastExchange = {you:q, say:"", steps:[], busy:true}; $("askBtn").disabled = true; renderAgent();
  const live = () => lastExchange === ex;
  turns.push(mine); if (turns.length > 10) turns = turns.slice(-10); if (turns[0].role !== "user") turns.shift();
  try {
    const {text} = await sampleFn([{role:"user", content:agentInstructions()}, ...turns], {tools:TOOLS, modelTier:"quick", signal:ctl.signal,
      onText:({text}) => { ex.say = text.split(/\n\s*\n/).pop(); if (live()) renderAgent(); }});
    const final = text.split(/\n\s*\n/).pop().trim(); ex.say = final;
    if (live()) turns.push({role:"assistant", content:final});
  } catch(e){
    turns = turns.filter(t => t !== mine);
    if (!live()) return;
    if (e.code === "cancelled") ex.say = "Stopped.";
    else if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","tools_unavailable"].includes(e.code)) { sampleFn = null; ex.say = basicSearch(q); ex.mode = "basic"; }
    else ex.say = e.code === "rate_limited" ? "I’m getting too many requests right now. Try again in a minute." : "That didn’t finish. Try asking again.";
  } finally { if (live()) { ex.busy = false; $("askBtn").disabled = false; renderAgent(); } }
}

// Points for what actually improves matches and emails, not for boxes filled in.
function strength(){
  const p = profile, roles = (p.deciders || []).length || (p.deciders_other || "").trim();
  const parts = [
    [words(p.ideal_customer) >= 6 ? 14 : words(p.ideal_customer) ? 5 : 0, 14, "describe your ideal customer (their size and situation)"],
    [words(p.problem) >= 6 ? 14 : words(p.problem) ? 5 : 0, 14, "say what problem you solve for them"],
    [words(p.sell) >= 4 ? 10 : words(p.sell) ? 4 : 0, 10, "say specifically what you sell"],
    [words(p.best_customers) ? 10 : 0, 10, "name a few of your best customers"],
    [p.read_from || (p.materials || []).some(m => m.kind === "business") ? 8 : 0, 8, "add your website or a document about your business"],
    [roles ? 4 : 0, 4, "say who you usually talk to"],
    [p.company && p.pitch ? 10 : p.company || p.pitch ? 5 : 0, 10, "add your company name and what you do"],
    [p.proof ? 10 : 0, 10, "add a result a customer got"],
    [(() => { const w = words(p.samples) + (p.materials || []).filter(m => m.kind === "email").reduce((n, m) => n + words(m.text), 0); return w >= 30 ? 10 : w ? 4 : 0; })(), 10, "add a few emails you’ve written"],
    [p.cta ? 5 : 0, 5, "say what first step you offer"],
    [p.address ? 5 : 0, 5, "add your business address"]];
  const score = parts.reduce((s, x) => s + x[0], 0);
  const next = parts.filter(x => x[0] < x[1]).sort((a, b) => (b[1] - b[0]) - (a[1] - a[0])).slice(0, 2).map(x => x[2]);
  return {score, next, level: score >= 70 ? "Strong" : score >= 40 ? "Good" : "Basic"};
}

function exportCSV(){
  const rows = LEADS.filter(l => l.tier !== "skip").sort((a, b) => (TIER_RANK[a.tier] ?? 9) - (TIER_RANK[b.tier] ?? 9) || score(b) - score(a));

const pick = (r, ...keys) => { for (const k of keys) if ((r[k] || "").trim()) return r[k].trim(); return ""; };

// Accepts our own export and the owner's sample sheet (org_name, leader_name, role, url_info, status...).
function importLeads(rows, fileName){
  const have = new Set(LEADS.map(l => (l.business_name + "|" + (l.email || "")).toLowerCase()));
  const stamp = Date.now().toString(36), added = [], contacted = [];
  rows.forEach((r, i) => {
    const name = pick(r, "business_name", "org_name", "company", "business");
    if (!name || /^not found$/i.test(name)) return;
    const email = pick(r, "email").toLowerCase(), key = (name + "|" + email).toLowerCase();
    if (have.has(key)) return;
    have.add(key);
    const type = pick(r, "category", "org_type", "type").replace(/^SMB-/i, "").replace(/([a-z])([A-Z])/g, "$1 $2");
    const l = {lead_id:`I${stamp}-${i}`, business_name:name, email, contact_name:pick(r, "contact_name", "leader_name", "contact"),
      contact_title:pick(r, "contact_title", "role", "title"), address:pick(r, "address"), phone:pick(r, "phone"),
      category:type === "Small and Medium Businesses" ? "Business" : type || "Business", website:pick(r, "website", "url_info", "url"),
      summary:pick(r, "summary", "what_they_do"), imported:fileName};
    const st = pick(r, "status", "stage").toLowerCase();
    if (STAGE_NAME[st] && st !== "new") { stages[l.lead_id] = {stage:st, at:Date.now()}; if (st === "emailed" || st === "replied") contacted.push(name); }
    added.push(l);
  });
  LEADS = [...LEADS, ...added];
  search = {...(search || {source:fileName, at:Date.now()}), leads:LEADS};
  store.set(K("search"), search); store.set(K("stages"), stages);
  if (contacted.length){
    const dnc = new Set((FIND.dnc || "").split("\n").map(x => x.trim()).filter(Boolean));
    contacted.forEach(n => dnc.add(n)); FIND.dnc = [...dnc].join("\n"); store.set(FKEY(), FIND);
  }
  return {added:added.length, contacted:contacted.length};
}

  readFind();
  if (!(FIND.desc || "").trim()) return showFindError("Write a sentence about where to look and what kinds of businesses first.");
  const b = $("fFill"); b.disabled = true; b.textContent = "Reading your description…";
  try {
    const d = await post("/api/understand", {description:`${profile.sell ? `I sell ${profile.sell}. ` : ""}This search: ${FIND.desc}`});
    FIND = {...FIND, types:d.types || [], types_other:d.types_other || "", other_on:!!d.types_other, city:d.city || FIND.city,
      radius:d.radius || FIND.radius, signals:d.signals || []};
    if (!profile.sell && d.sell) { profile.sell = d.sell; store.set(K("profile"), profile); }
    store.set(FKEY(), FIND); renderFind(); toast("Filled in. Check the choices and change anything that’s not right.");
  } catch(e){ showFindError(e.message); }
}
// Chips and "Other…" toggles on both the profile and search pages.
document.addEventListener("click", e => {
  if (!e.target.closest("#findView, #bizView")) return;
  const other = e.target.closest("[data-other]");
  if (other){
    const on = other.getAttribute("aria-pressed") !== "true", box = $(other.dataset.other);
    other.setAttribute("aria-pressed", on); box.hidden = !on;
    if (other.dataset.other === "fOtherBox") { FIND.other_on = on; store.set(FKEY(), FIND); }
    else { profile.deciders_other_on = on; store.set(K("profile"), profile); }
    if (on) box.querySelector("input")?.focus();
    return;
  }
  const ch = e.target.closest("[data-chips] .chip");
  if (ch){
    const box = ch.closest("[data-chips]"), name = box.dataset.chips, val = ch.dataset.val;
    const obj = box.dataset.src === "profile" ? profile : FIND;
    if (box.dataset.multi === "1"){ const s = new Set(obj[name] || []); s.has(val) ? s.delete(val) : s.add(val); obj[name] = [...s]; ch.setAttribute("aria-pressed", s.has(val)); }
    else { obj[name] = val; box.querySelectorAll(".chip[data-val]").forEach(c => c.setAttribute("aria-pressed", c === ch)); }
    if (box.dataset.src === "profile") store.set(K("profile"), profile); else store.set(FKEY(), FIND);
    if (name === "radius") { readFind(); renderFind(); }
    refreshStrength(); return;
  }
  if (!e.target.closest("#findView")) return;
  if (e.target.closest("#fGo")) return runSearch();
  if (e.target.closest("#fFill")) return fillFromSentence();
  if (e.target.closest("#fExample")){ readFind(); FIND = {...FIND, ...EXAMPLE, desc:EXAMPLE_TEXT}; store.set(FKEY(), FIND); renderFind(); }
});
document.addEventListener("input", e => { if (e.target.closest("#findView")) readFind(); });

/* ---------- leads that aren't on the board ---------- */
function renderAside(){
  const need = LEADS.filter(l => l.tier === "need_email"), set = LEADS.filter(l => l.tier === "skip");
  $("aside").innerHTML = (need.length ? `<section class="alist"><h2>Need an email (${need.length})</h2>
      <p class="note">Real businesses with no email on their website. Call them or check their site, paste the email you get, and we’ll check it and add them to your board.</p>
      ${need.map(l => `<div class="arow"><b>${esc(l.business_name)}</b><span>${esc([l.phone || "No phone listed", l.address].filter(Boolean).join(" · "))}</span>
        <form data-add="${esc(l.lead_id)}"><label class="sr" for="add-${esc(l.lead_id)}">Email for ${esc(l.business_name)}</label>
        <input id="add-${esc(l.lead_id)}" type="email" placeholder="name@business.com" autocomplete="off"><button class="btn" type="submit">Add email</button>
        ${webUrl(l.website) ? `<a class="btn ghost" href="${esc(webUrl(l.website))}" target="_blank" rel="noopener">Website</a>` : ""}</form></div>`).join("")}</section>` : "")
    + (set.length ? `<section class="alist"><h2>Set aside (${set.length})</h2>${set.map(l => `<div class="arow"><b>${esc(l.business_name)}</b><span>${esc(l.next)}</span></div>`).join("")}</section>` : "");
}
document.addEventListener("submit", async e => {
  const f = e.target.closest("[data-add]"); if (!f) return;
  e.preventDefault();
  const id = f.dataset.add, email = f.querySelector("input").value.trim(); if (!email) return;
  try {
    const card = await post("/api/add-email", {job_id:search?.job_id, lead_id:id, email, profile:search?.profile || {}});
    LEADS = LEADS.map(l => String(l.lead_id) === String(id) ? card : l); search.leads = LEADS; store.set(K("search"), search); renderAll();
    toast(card.email ? `Added. ${card.business_name} is now in ${card.tier_label}.` : "That email didn’t check out. Try another.");
  } catch(err){ toast(err.message); }
});

let toastT;
function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2400); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  if ($("side").classList.contains("open") && !e.target.closest("#side") && !e.target.closest("#menuBtn")) { $("side").classList.remove("open"); return; }
  if (e.target.closest("[data-export]")) { $("side").classList.remove("open"); return exportCSV(); }
  const go = e.target.closest("[data-go]"); if (go){ $("side").classList.remove("open"); view = ["find","business","settings"].includes(go.dataset.go) ? go.dataset.go : "board"; viewFilter = null; if (view === "find") renderFind(); if (view === "business") renderBusiness(); renderAll(); window.scrollTo(0, 0); return; }
  const ps = e.target.closest("[data-persona]"); if (ps){ if (ps.dataset.persona !== persona){ persona = ps.dataset.persona; store.set("ll4-persona", persona); loadPersona(); FIND = Object.assign({}, FIND_DEFAULT, store.get(FKEY(), {})); JOB = null; view = LEADS.length ? "board" : (profile.sell ? "find" : "business"); viewFilter = null; renderFind(); renderBusiness(); turns = []; lastExchange = null; renderAgent(); renderAll(); toast(`Now finding customers for ${profile.company || "your business"}`); } $("side").classList.remove("open"); return; }
  const v = e.target.closest("[data-view]"); if (v){ const vw = views().find(x => x.key === v.dataset.view); viewFilter = viewFilter?.key === vw.key ? null : {ids:new Set(vw.ids), label:vw.label, key:vw.key}; $("side").classList.remove("open"); renderAll(); return; }
  const o = e.target.closest("[data-open]"); if (o) return openLead(o.dataset.open);
  const sg = e.target.closest(".sg"); if (sg) return ask(sg.textContent);
  const tab = e.target.closest(".seg button"); if (tab && openId){ variant = +tab.dataset.v; renderMail(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ if ($("drawer").classList.contains("on")) closeDrawer(); else $("side").classList.remove("open"); return; }
  const o = e.target.closest?.("article[data-open]"); if (o && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openLead(o.dataset.open); }
});
$("askForm").addEventListener("submit", e => { e.preventDefault(); ask($("askInput").value); });
$("tAsk").addEventListener("click", () => ask("Who should I follow up with?"));
$("menuBtn").addEventListener("click", () => $("side").classList.add("open"));
$("dClose").addEventListener("click", closeDrawer);
$("scrim").addEventListener("click", closeDrawer);

renderFind();
renderBusiness();
renderAll();
// The server says which keys it has. Rewriting uses the server; the Ask box filters by keyword.
fetch("/api/status").then(r => r.json()).then(s => { SERVER = s; sampleFn = s.claude ? {} : null; renderFind(); renderBusiness(); renderAll(); }).catch(() => {});

</script>
