<title>Bid Source Audit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column; summary strip, sticky filter bar, then a review queue of source rows. */
:root {
  --bg: #f6f7f5; --surface: #ffffff; --fg: #1d2420; --muted: #5d6a63; --line: #dfe4e0;
  --accent: #2f6b4f; --accent-soft: #e3efe8;
  --ok: #2c7a4b; --ok-soft: #e2f3e8; --bad: #b3412f; --bad-soft: #f8e5e1; --warn: #9a6a12; --warn-soft: #f6edd6;
  --sans: "Public Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --surface: #1a201d; --fg: #e4ebe6; --muted: #98a69e; --line: #2c3530;
  --accent: #7cc49d; --accent-soft: #1f3329;
  --ok: #7cc49d; --ok-soft: #1d3326; --bad: #ef8f7c; --bad-soft: #3a221d; --warn: #e2b960; --warn-soft: #362c17; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1a201d; --fg: #e4ebe6; --muted: #98a69e; --line: #2c3530;
  --accent: #7cc49d; --accent-soft: #1f3329;
  --ok: #7cc49d; --ok-soft: #1d3326; --bad: #ef8f7c; --bad-soft: #3a221d; --warn: #e2b960; --warn-soft: #362c17; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
h1 { font-size: 1.6rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.lede { color: var(--muted); margin: 4px 0 0; max-width: 65ch; }
.mono { font-family: var(--mono); font-size: 0.82em; }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.stat .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
.stat .v { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.filters { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 0.85rem var(--sans); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
select, input[type="search"], input[type="text"] { font: 0.88rem var(--sans); padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); min-width: 0; }
input[type="search"] { flex: 1 1 180px; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.notice { background: var(--warn-soft); color: var(--warn); padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; }
.list { display: grid; gap: 0; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 20px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
.row[data-verdict="works"] { box-shadow: inset 3px 0 0 var(--ok); padding-left: 14px; }
.row[data-verdict="dead"], .row[data-verdict="wrong_url"] { box-shadow: inset 3px 0 0 var(--bad); padding-left: 14px; }
.row[data-verdict="duplicate"] { box-shadow: inset 3px 0 0 var(--warn); padding-left: 14px; }
.name { font-weight: 600; }
.meta { color: var(--muted); font-size: 0.83rem; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.links { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.85rem; margin-top: 4px; min-width: 0; }
.links a { color: var(--accent); overflow-wrap: anywhere; }
.links .none { color: var(--bad); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tag { font-size: 0.72rem; padding: 2px 7px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.tag.plat { background: var(--accent-soft); color: var(--accent); }
.tag.miss { background: var(--bad-soft); color: var(--bad); }
.review { display: grid; gap: 6px; justify-items: end; align-content: start; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 0.8rem var(--sans); padding: 6px 10px; border: 0; border-right: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"][data-v="works"] { background: var(--ok); color: var(--surface); }
.seg button[aria-pressed="true"][data-v="dead"], .seg button[aria-pressed="true"][data-v="wrong_url"] { background: var(--bad); color: var(--surface); }
.seg button[aria-pressed="true"][data-v="duplicate"] { background: var(--warn); color: var(--surface); }
.seg button:disabled { opacity: 0.5; cursor: not-allowed; }
.fix { display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; }
.fix input { width: 220px; max-width: 100%; }
.fix button { font: 600 0.8rem var(--sans); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--surface); cursor: pointer; }
.who { font-size: 0.75rem; color: var(--muted); }
.more { justify-self: center; font: 600 0.9rem var(--sans); padding: 8px 18px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.empty { padding: 32px 0; color: var(--muted); text-align: center; }
@media (max-width: 680px) { .row { grid-template-columns: minmax(0, 1fr); } .review { justify-items: start; } .fix { justify-content: start; } }
@media (prefers-reduced-motion: no-preference) { .chip, .seg button { transition: background-color .12s, color .12s; } }
</style>

<div class="wrap">
  <header>
    <h1>Bid Source Audit</h1>
    <p class="lede">Every place in WA, OR and ID we plan to search for open bids. Open each procurement link, then mark it. Reviews are shared with the team and get folded back into the registry.</p>
  </header>
  <section class="strip" id="strip" aria-label="Coverage"></section>
  <div id="notice" class="notice" hidden></div>
  <div class="filters" role="search">
    <div class="chips" id="scopes"></div>
    <select id="f-state" aria-label="State"><option value="">All states</option><option>WA</option><option>OR</option><option>ID</option><option>US</option></select>
    <select id="f-type" aria-label="Agency type"><option value="">All types</option></select>
    <input type="search" id="f-q" placeholder="Search name, city, URL" aria-label="Search">
    <span class="count" id="count"></span>
  </div>
  <div class="list" id="list"></div>
  <button class="more" id="more" hidden>Show more</button>
</div>

<script>
const SOURCES = __DATA__;
const VERDICTS = [["works","Lists bids"],["wrong_url","Wrong URL"],["dead","Dead"],["duplicate","Duplicate"]];
const FLAG_LABEL = {
  procurement_url_shared: "URL shared with another row", possible_duplicate: "possible duplicate",
  procurement_url_looks_archived: "looks like an archive", procurement_url_is_pdf: "PDF, not a listing",
  procurement_on_other_domain: "other domain", http_not_https: "http", url_looks_out_of_state: "out of state?"
};
const SCOPES = [
  ["priority", "Test counties + portals", r => r.test_county || r.agency_type === "platform" || r.agency_type === "federal" || r.agency_type === "state"],
  ["has_url", "Has bid URL", r => !!r.procurement_url],
  ["flagged", "Flagged", r => r.flags.some(f => FLAG_LABEL[f])],
  ["missing", "No bid URL", r => !r.procurement_url],
  ["unreviewed", "Not reviewed", r => !reviews[r.id]],
  ["all", "All", () => true],
];
let scope = "priority", shown = 80, reviews = {}, db = null, user = null, names = {};
try { scope = localStorage.getItem("audit-scope") || scope; } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const types = [...new Set(SOURCES.map(r => r.agency_type))].sort();
$("f-type").insertAdjacentHTML("beforeend", types.map(t => `<option value="${t}">${t.replace("_"," ")}</option>`).join(""));

function renderScopes() {
  $("scopes").innerHTML = SCOPES.map(([k, label]) => `<button class="chip" data-k="${k}" aria-pressed="${k === scope}">${label}</button>`).join("");
}
$("scopes").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  scope = b.dataset.k; shown = 80; try { localStorage.setItem("audit-scope", scope); } catch (e) {}
  renderScopes(); renderList();
});
["f-state","f-type","f-q"].forEach(id => $(id).addEventListener("input", () => { shown = 80; renderList(); }));
$("more").addEventListener("click", () => { shown += 120; renderList(); });

function renderStrip() {
  const cell = (k, have, total, sub) => `<div class="stat"><span class="k">${k}</span><span class="v">${have.toLocaleString()}<span class="s"> / ${total.toLocaleString()}</span></span><span class="s">${sub}</span><div class="bar"><i style="width:${total ? (100*have/total).toFixed(1) : 0}%"></i></div></div>`;
  const by = st => SOURCES.filter(r => r.state === st);
  let html = ["WA","OR","ID"].map(st => { const rs = by(st); return cell(st, rs.filter(r => r.procurement_url).length, rs.length, "sources with a bid URL"); }).join("");
  const pri = SOURCES.filter(SCOPES[0][2]);
  html += cell("Test counties + portals", pri.filter(r => r.procurement_url).length, pri.length, "with a bid URL");
  const done = Object.values(reviews);
  const ok = done.filter(r => r.verdict === "works").length;
  html += cell("Reviewed", done.length, SOURCES.filter(r => r.procurement_url).length, `${ok} confirmed listing bids`);
  $("strip").innerHTML = html;
}

function matches() {
  const st = $("f-state").value, ty = $("f-type").value, q = $("f-q").value.trim().toLowerCase();
  const pred = SCOPES.find(s => s[0] === scope)[2];
  return SOURCES.filter(r => pred(r) && (!st || r.state === st) && (!ty || r.agency_type === ty) &&
    (!q || [r.name, r.city, r.county, r.procurement_url, r.homepage_url, r.id].some(v => v && v.toLowerCase().includes(q))))
    .sort((a, b) => (!!b.procurement_url - !!a.procurement_url) || a.state.localeCompare(b.state) || a.name.localeCompare(b.name));
}

function rowHtml(r) {
  const rv = reviews[r.id];
  const place = [r.city, r.county && r.county + " County", r.state].filter(Boolean).join(", ");
  const tags = [
    r.platform && r.platform !== "custom" ? `<span class="tag plat">${esc(r.platform)}</span>` : "",
    ...r.flags.filter(f => FLAG_LABEL[f]).map(f => `<span class="tag">${FLAG_LABEL[f]}</span>`),
    r.notes ? `<span class="tag plat" title="${esc(r.notes)}">note</span>` : "",
  ].join("");
  const dis = db ? "" : "disabled";
  const showFix = rv && (rv.verdict === "wrong_url" || rv.fixed_url || rv.note);
  return `<article class="row" data-id="${r.id}" data-verdict="${rv?.verdict || ""}">
    <div style="min-width:0">
      <div class="name">${esc(r.name)}</div>
      <div class="meta"><span>${esc(r.agency_type.replace("_"," "))}</span><span>${esc(place)}</span><span class="mono">${esc(r.id)}</span></div>
      <div class="links">
        ${r.procurement_url ? `<a href="${esc(r.procurement_url)}" target="_blank" rel="noopener">Bid page ↗</a>` : `<span class="none">No bid URL yet</span>`}
        ${r.homepage_url ? `<a href="${esc(r.homepage_url)}" target="_blank" rel="noopener">Homepage ↗</a>` : ""}
      </div>
      ${tags ? `<div class="tags">${tags}</div>` : ""}
      ${r.notes ? `<div class="meta" style="margin-top:4px">${esc(r.notes)}</div>` : ""}
    </div>
    <div class="review">
      <div class="seg" role="group" aria-label="Verdict">${VERDICTS.map(([v, l]) => `<button data-v="${v}" aria-pressed="${rv?.verdict === v}" ${dis}>${l}</button>`).join("")}</div>
      <div class="fix" ${showFix ? "" : "hidden"}>
        <input type="text" id="fix-${r.id}" placeholder="Correct bid URL" value="${esc(rv?.fixed_url || "")}" aria-label="Correct bid URL">
        <input type="text" id="note-${r.id}" placeholder="Note" value="${esc(rv?.note || "")}" aria-label="Note">
        <button data-save ${dis}>Save</button>
      </div>
      ${rv ? `<span class="who">${esc(names[rv.by] || "Someone")} · ${new Date(rv.at).toLocaleString([], {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"})}</span>` : ""}
    </div>
  </article>`;
}

function renderList() {
  const ms = matches();
  $("count").textContent = `${ms.length.toLocaleString()} sources`;
  $("list").innerHTML = ms.length ? ms.slice(0, shown).map(rowHtml).join("") : `<div class="empty">No sources match these filters.</div>`;
  $("more").hidden = ms.length <= shown;
}

async function save(id, patch) {
  if (!db) return;
  const prev = reviews[id] || {};
  const body = { verdict: prev.verdict || null, fixed_url: prev.fixed_url || "", note: prev.note || "", ...patch, by: await user.id(), at: new Date().toISOString() };
  try { await db.collection("reviews").doc(id).set(body); }
  catch (e) { showNotice(e.code === "permission_denied" ? "You can view this audit but not record reviews. Ask Colin for edit access." : "That review didn't save. Check your connection and try again."); }
}

$("list").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const id = row.dataset.id;
  const vb = e.target.closest("button[data-v]");
  if (vb) {
    const v = vb.dataset.v;
    if (v === "wrong_url") { row.querySelector(".fix").hidden = false; }
    save(id, { verdict: v });
  }
  if (e.target.closest("button[data-save]")) {
    save(id, { fixed_url: $("fix-" + id).value.trim(), note: $("note-" + id).value.trim() });
  }
});

function showNotice(t) { $("notice").textContent = t; $("notice").hidden = !t; }

renderScopes(); renderStrip(); renderList();

(async () => {
  [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!db || !user) { db = null; showNotice("Sign in to claude.ai to record reviews. You can still browse every source."); return; }
  db.collection("reviews").onSnapshot(async snap => {
    reviews = {};
    snap.docs.forEach(d => { reviews[d.id] = d.data(); });
    const ids = [...new Set(Object.values(reviews).map(r => r.by).filter(Boolean))];
    if (ids.length) { const ps = await user.profiles(ids); ids.forEach(i => { names[i] = ps[i]?.name || "Someone"; }); }
    renderStrip(); renderList();
  }, () => showNotice("Lost the connection to shared reviews. Reload the page to reconnect."));
  renderList();
})();
</script>
