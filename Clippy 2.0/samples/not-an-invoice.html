<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Morning at the Lake</title>
<style>
  body { margin: 0; padding: 40px; background: #f4efe6; font-family: Georgia, serif; color: #3a3a3a; text-align: center; }
  h1 { font-weight: normal; font-size: 32px; margin: 0 0 6px; }
  p { color: #777; margin: 0 0 24px; font-style: italic; }
  svg { width: 1100px; max-width: 100%; border: 12px solid #fff; box-shadow: 0 4px 18px rgba(0,0,0,.15); }
</style>
</head>
<body>
  <h1>Morning at the Lake</h1>
  <p>A watercolor sketch, autumn</p>
  <svg viewBox="0 0 1100 620" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#9cc9e8"/><stop offset="1" stop-color="#fde3c2"/>
      </linearGradient>
      <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7fb0cf"/><stop offset="1" stop-color="#3f6f8f"/>
      </linearGradient>
    </defs>
    <rect width="1100" height="620" fill="url(#sky)"/>
    <circle cx="820" cy="170" r="60" fill="#ffd98a" opacity=".9"/>
    <path d="M0 330 L180 170 L320 300 L470 130 L640 320 L800 210 L1100 340 L1100 400 L0 400 Z" fill="#6d7f99"/>
    <path d="M300 160 L330 300 L470 130 Z" fill="#fff" opacity=".35"/>
    <path d="M0 370 L220 260 L420 360 L620 270 L860 360 L1100 300 L1100 420 L0 420 Z" fill="#4f6b5a"/>
    <rect y="410" width="1100" height="210" fill="url(#water)"/>
    <g fill="#2f4a3a">
      <path d="M90 420 l25 -90 l25 90 z"/><path d="M130 420 l20 -70 l20 70 z"/>
      <path d="M940 420 l28 -100 l28 100 z"/><path d="M990 420 l22 -75 l22 75 z"/>
    </g>
    <path d="M520 470 q40 -18 80 0 l-12 16 h-56 z" fill="#8a5a3c"/>
    <line x1="560" y1="470" x2="560" y2="430" stroke="#5a3a28" stroke-width="3"/>
    <g stroke="#fff" stroke-width="2" opacity=".5" fill="none">
      <path d="M200 500 h80"/><path d="M700 530 h120"/><path d="M380 560 h60"/>
    </g>
    <g stroke="#333" stroke-width="2" fill="none">
      <path d="M300 110 q8 -8 16 0 q8 -8 16 0"/><path d="M360 90 q6 -6 12 0 q6 -6 12 0"/>
    </g>
  </svg>
</body>
</html>
