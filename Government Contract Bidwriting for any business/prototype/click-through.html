for Generative Artificial Intelligence Research Tool
1.1 SUMMARY
The City of Lakewood, WA serves a population of 63,000 people with an average permit
volume close to 2,000 permits annually. The City seeks to develop a generative artificial
intelligence (AI) application to assist staff in researching applicable federal, state and local
municipal laws, codes, rules and design manuals as part of the project permit review
process. This tool is intended to improve efficiencies by reducing time necessary to prepare
responses to customers on development project feasibility and associated requirements, as
well as assist in the development of staff reports, letters and public notices. This tool is not
intended to reduce or modify our workforce. The use of this AI tool is to provide support to
project permit review to streamline processes by conducting thorough research more
efficiently and effectively for residents.
The City seeks responses to this RFP from qualified, interested and eligible firms with
proven expertise.
The scopes of work, budget and schedule are further described below.
City staff will assist in the project management of the project, to be further refined once a
firm has been selected to perform the work.
1.2 BACKGROUND
In 2024, the Washington State Department of Commerce released a funding opportunity
to support state law changes through 2SSB 5290 for Local Project Review. This grant
program assists local governments in updating their permitting system through the Paper
to Digital Permitting Grant Program. All work must be completed by June 2025. As part of
this grant award, the City is seeking a AI research tool that includes but not limited to:
• 100% Digital System. We seek a tool that does not require additional City network
server needs or housed on the City server. This search tool will draw off of applicable
federal and state laws, agency rulemaking, Lakewood Municipal Codes, as well as
adopted design and engineering manuals. Validity, reliability and ability to update
data sources as rules are adopted or amended is strongly desired. Outputs of this AI
tool must also be reviewed by City personnel prior to be used in an official capacity.
• Cybersecurity, resiliency and copyrights. The AI tool must be consistent with the
City’s Information Technology policies. Respondents need to address cybersecurity,
data integrity, privacy protections and possible copyrights or trademarks if awarded.
• Transparency and accountability. Ensure prompts and outputs reference data
sources and appropriate citations. Outputs must also be retained to ensure
compliance with the Washington State Public Records Act (Chapter 42.56 RCW).
• Report. The search tool should be able to populate the research into custom
templates such as a staff report and notices.
