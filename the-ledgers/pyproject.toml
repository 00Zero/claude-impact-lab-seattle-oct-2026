[project]
name = "receipts"
version = "0.1.0"
description = "Claude Code plugin that checks an AI agent's payments with plain code and keeps a tamper-evident log."
requires-python = ">=3.9"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py39"  # hooks run on the system python3

[tool.pytest.ini_options]
testpaths = ["tests"]
